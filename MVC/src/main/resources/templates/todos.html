<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Todos</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Your Todos</h1>
        <p>Welcome, <span th:text="${username}"></span></p>
        <ul>
            <li th:each="todo : ${todos}" th:classappend="${todo.completed} ? 'completed' : ''">
                <span th:text="${todo.task}"></span>
                <div class="button-container">
                    <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post">
                        <button type="submit" th:text="${todo.completed != null ? 'Unmark' : 'Mark'}"></button>
                    </form>
                    <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
        <form action="/todos" method="post" id="submit-form">
            <input type="text" name="task" placeholder="New Todo" required>
            <button type="submit">Add Todo</button>
        </form>
        <a  id="logout" href="/logout">Logout</a>
    </div>
</body>
</html>
